<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="David Jansson — software developer portfolio, background, interests, and goals."
    />
    <title>David Jansson — Portfolio</title>

    <!-- FONT WEIGTH -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <!-- SYTLE SHEETS -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/nav-style.css" />
    <link rel="stylesheet" href="../css/footer-style.css" />
    <link rel="stylesheet" href="../css/gerneral-style.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <header class="site-header sticky-md-top">
      <nav
        class="container-fluid d-flex flex-column-reverse flex-md-row justify-content-between align-items-center gap-3 p-3"
        aria-label="Main"
      >
        <ul class="nav flex-wrap justify-content-center gap-2">
          <li><a href="index.html" class="site-link">Back</a></li>
          <li>
            <a href="newLetter.html#news-letters" class="site-link"
              >News Letters</a
            >
          </li>
          <li>
            <a href="newletterForum.html" class="site-link">Add News letter</a>
          </li>
        </ul>
        <img
          src="../img/IMG_2744.JPG"
          alt="David Jansson"
          width="150"
          height="150"
          class="profile-image rounded-circle object-fit-cover"
        />
      </nav>
    </header>

    <main class="container py-4 flex-grow-1">
      <form id="news-form">
        <div class="mb-3">
          <label for="author" class="form-label fw-bold">Author Name</label>
          <input
            type="text"
            class="form-control"
            id="author"
            name="author"
            required
          />
        </div>
        <div class="mb-3">
          <label for="datetime" class="form-label fw-bold">Date</label>
          <input
            type="date"
            class="form-control"
            id="datetime"
            name="datetime"
            required
          />
        </div>
        <div class="mb-3">
          <label for="message" class="form-label fw-bold">Message</label>
          <textarea
            class="form-control"
            id="message"
            name="message"
            rows="5"
            placeholder="Share your thoughts..."
            required
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary px-4">Post</button>
      </form>
    </main>

    <footer class="site-footer py-4 px-3 px-md-4">
      <ul class="list-unstyled d-flex flex-wrap align-items-center gap-3 mb-0">
        <li>
          <a
            href="https://github.com/DavidJanssonDev"
            class="footer-link"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </li>
        <li>
          <a href="mailto:david.m.jansson@gmail.com" class="footer-link"
            >Email</a
          >
        </li>
      </ul>
    </footer>

    <script type="module" src="../js/newletterforum.js"></script>
  </body>
</html>
